<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <defs>
    <linearGradient id="kdkGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <linearGradient id="kdkBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- KDK Collegiate Emblem / Shield -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield Frame -->
    <path d="M 30,5 L 54,14 C 54,38 30,53 30,53 C 30,53 6,38 6,14 Z" fill="#111319" stroke="url(#kdkGoldGrad)" stroke-width="2.5"/>
    <!-- Inner Gear & Flame -->
    <circle cx="30" cy="27" r="14" fill="none" stroke="url(#kdkBlueGrad)" stroke-width="2" stroke-dasharray="4 2.5"/>
    <circle cx="30" cy="27" r="8" fill="#191c21" stroke="#ffb703" stroke-width="1.5"/>
    <path d="M 28,18 C 28,18 33,21 31,25 C 30,27 27,27 27,30 C 27,33 33,33 33,33" fill="none" stroke="#ffb703" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(74, 22)">
    <text x="0" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" letter-spacing="2" fill="#ffffff">
      KDKCE
    </text>
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="10.5" letter-spacing="1.2" fill="#94a3b8">
      COLLEGE OF ENGINEERING
    </text>
  </g>
</svg>
