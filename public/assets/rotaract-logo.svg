<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="rotaractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a7a" />
      <stop offset="100%" stop-color="#d91b5c" />
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#d91b5c" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rotaract Gear / Wheel Icon -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Outer Gear Teeth -->
    <circle cx="30" cy="30" r="26" fill="none" stroke="url(#rotaractGrad)" stroke-width="5" stroke-dasharray="8 5.6"/>
    <circle cx="30" cy="30" r="22" fill="#111319" stroke="url(#rotaractGrad)" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <!-- 6 Spokes -->
    <line x1="30" y1="8" x2="30" y2="52" stroke="url(#rotaractGrad)" stroke-width="2.5"/>
    <line x1="11" y1="19" x2="49" y2="41" stroke="url(#rotaractGrad)" stroke-width="2.5"/>
    <line x1="11" y1="41" x2="49" y2="19" stroke="url(#rotaractGrad)" stroke-width="2.5"/>
    <!-- Center Hub & Keyway -->
    <circle cx="30" cy="30" r="6" fill="url(#rotaractGrad)"/>
    <rect x="28.5" y="22" width="3" height="5" fill="url(#rotaractGrad)"/>
  </g>

  <!-- Typography -->
  <g transform="translate(80, 22)">
    <text x="0" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" letter-spacing="1.5" fill="#ffffff">
      ROTARACT
    </text>
    <text x="126" y="20" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" letter-spacing="2" fill="#d91b5c">
      CLUB
    </text>
    <text x="0" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="11.5" letter-spacing="3" fill="#00e5ff">
      KDKCE NAGPUR
    </text>
  </g>
</svg>
