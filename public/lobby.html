<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Lobby | KDK INDUCTION QUIZ 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arena: '#0c0e13',
            surface: '#111319',
            card: '#191c21',
            cyan: '#00e5ff',
            magenta: '#d91b5c',
            amber: '#ffb703',
            emerald: '#00f59b'
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/qrcode.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-arena text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between relative select-none">
  
  <!-- Canvas Arena Background & Physics Surface -->
  <canvas id="lobby-canvas" class="absolute inset-0 w-full h-full z-0 block"></canvas>

  <!-- Top Floating Header Bar -->
  <header class="relative z-20 w-full px-6 py-4 flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-4 bg-surface/70 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10">
      <a href="/" class="flex items-center">
        <div class="bg-white/95 px-2 py-0.5 rounded-lg flex items-center shadow-md">
          <img src="/assets/rotaract-logo.png" alt="Rotaract Club of KDKCE" class="h-7 md:h-8 w-auto object-contain" />
        </div>
      </a>
      <div class="h-5 w-px bg-white/20"></div>
      <div class="text-xs">
        <span class="text-cyan font-bold tracking-wider font-heading block uppercase">Induction Arena</span>
        <span class="text-slate-400 text-[10px]">Waiting for host to begin</span>
      </div>
    </div>

    <!-- Active Team Indicator, QR Modal Toggle & Connection Status -->
    <div class="flex items-center gap-3">
      <button id="btn-show-qr-modal" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface/80 backdrop-blur-md border border-white/10 text-xs font-semibold text-slate-300 hover:text-cyan hover:border-cyan/40 transition-all">
        <svg class="w-3.5 h-3.5 text-cyan" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/>
        </svg>
        <span>Join QR</span>
      </button>

      <div id="my-team-pill" class="hidden items-center gap-2 px-3 py-1.5 rounded-full bg-surface/80 backdrop-blur-md border border-cyan/40 text-xs font-semibold text-cyan shadow-[0_0_12px_rgba(0,229,255,0.2)]">
        <span id="my-team-avatar">⚡</span>
        <span id="my-team-name">My Team</span>
      </div>

      <div id="connection-badge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border bg-emerald-950/60 text-emerald-400 border-emerald-800/80 backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="connection-status-text">Connected</span>
      </div>
    </div>
  </header>

  <!-- Centered Empty State Overlay (Visible only when team count is 0) -->
  <div id="empty-state-overlay" class="relative z-10 flex-1 flex flex-col items-center justify-center pointer-events-none p-6 text-center">
    <div class="max-w-md p-6 sm:p-8 rounded-2xl bg-surface/80 backdrop-blur-md border border-white/10 space-y-4 pointer-events-auto shadow-2xl">
      <div class="w-12 h-12 rounded-full bg-cyan/10 border border-cyan/30 mx-auto flex items-center justify-center text-cyan">
        <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </div>
      <div>
        <h3 class="text-xl font-bold font-heading text-white">
          Waiting for teams to join…
        </h3>
        <p class="text-xs text-slate-400 mt-0.5">
          Scan the QR code below to enter the arena.
        </p>
      </div>

      <!-- In-Lobby QR Code -->
      <div class="inline-block bg-white p-2.5 rounded-xl shadow-inner mx-auto">
        <div id="lobby-qrcode" class="flex justify-center items-center"></div>
      </div>
      <p id="lobby-join-url-label" class="text-[11px] font-mono text-cyan truncate"></p>
    </div>
  </div>

  <!-- QR Modal Overlay -->
  <div id="qr-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cyber-card p-6 bg-card border border-cyan/40 max-w-xs w-full text-center space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <span class="text-xs font-mono font-bold text-cyan uppercase">Direct Join QR</span>
        <button id="btn-close-qr-modal" class="text-slate-400 hover:text-white text-sm font-bold">✕</button>
      </div>
      <div class="bg-white p-3 rounded-xl inline-block mx-auto">
        <div id="modal-qrcode" class="flex justify-center items-center"></div>
      </div>
      <p id="modal-join-url-label" class="text-[11px] font-mono text-cyan truncate px-2"></p>
    </div>
  </div>

  <!-- Bottom Floating Stats Bar -->
  <footer class="relative z-20 w-full px-6 py-4 flex items-center justify-between pointer-events-none">
    <div class="px-4 py-2 rounded-xl bg-surface/70 backdrop-blur-md border border-white/10 text-xs text-slate-400 flex items-center gap-2 pointer-events-auto">
      <span>Connected Teams in Arena:</span>
      <span id="team-counter" class="text-cyan font-bold font-mono text-sm">0</span>
    </div>

    <div class="text-[11px] text-slate-500 hidden sm:block">
      Live Physics Engine • 60 FPS Canvas
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/lobby.js"></script>
</body>
</html>
