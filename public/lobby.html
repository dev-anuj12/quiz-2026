<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Lobby | KDK INDUCTION QUIZ 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            arena: '#0c0e13',
            surface: '#111319',
            card: '#191c21',
            cyan: '#00e5ff',
            magenta: '#d91b5c',
            amber: '#ffb703',
            emerald: '#00f59b'
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-arena text-slate-100 h-screen w-screen overflow-hidden flex flex-col justify-between relative select-none">
  
  <!-- Canvas Arena Background & Physics Surface -->
  <canvas id="lobby-canvas" class="absolute inset-0 w-full h-full z-0 block"></canvas>

  <!-- Top Floating Header Bar -->
  <header class="relative z-20 w-full px-6 py-4 flex items-center justify-between pointer-events-auto">
    <div class="flex items-center gap-4 bg-surface/70 backdrop-blur-md px-4 py-2 rounded-xl border border-white/10">
      <a href="/" class="flex items-center">
        <div class="bg-white/95 px-2 py-0.5 rounded-lg flex items-center shadow-md">
          <img src="/assets/rotaract-logo.png" alt="Rotaract Club of KDKCE" class="h-7 md:h-8 w-auto object-contain" />
        </div>
      </a>
      <div class="h-5 w-px bg-white/20"></div>
      <div class="text-xs">
        <span class="text-cyan font-bold tracking-wider font-heading block uppercase">Induction Arena</span>
        <span class="text-slate-400 text-[10px]">Waiting for host to begin</span>
      </div>
    </div>

    <!-- Active Team Indicator & Connection Status -->
    <div class="flex items-center gap-3">
      <div id="my-team-pill" class="hidden items-center gap-2 px-3 py-1.5 rounded-full bg-surface/80 backdrop-blur-md border border-cyan/40 text-xs font-semibold text-cyan shadow-[0_0_12px_rgba(0,229,255,0.2)]">
        <span id="my-team-avatar">⚡</span>
        <span id="my-team-name">My Team</span>
      </div>

      <div id="connection-badge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border bg-emerald-950/60 text-emerald-400 border-emerald-800/80 backdrop-blur-md">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="connection-status-text">Connected</span>
      </div>
    </div>
  </header>

  <!-- Centered Empty State Overlay (Visible only when team count is 0) -->
  <div id="empty-state-overlay" class="relative z-10 flex-1 flex flex-col items-center justify-center pointer-events-none p-6 text-center">
    <div class="max-w-md p-8 rounded-2xl bg-surface/40 backdrop-blur-sm border border-white/5 space-y-3">
      <div class="w-12 h-12 rounded-full bg-cyan/10 border border-cyan/30 mx-auto flex items-center justify-center text-cyan">
        <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
      </div>
      <h3 class="text-xl sm:text-2xl font-bold font-heading text-white">
        Waiting for teams to join…
      </h3>
      <p class="text-xs sm:text-sm text-slate-400">
        Scan the QR to enter the arena.
      </p>
    </div>
  </div>

  <!-- Bottom Floating Stats Bar -->
  <footer class="relative z-20 w-full px-6 py-4 flex items-center justify-between pointer-events-none">
    <div class="px-4 py-2 rounded-xl bg-surface/70 backdrop-blur-md border border-white/10 text-xs text-slate-400 flex items-center gap-2 pointer-events-auto">
      <span>Connected Teams in Arena:</span>
      <span id="team-counter" class="text-cyan font-bold font-mono text-sm">0</span>
    </div>

    <div class="text-[11px] text-slate-500 hidden sm:block">
      Live Physics Engine • 60 FPS Canvas
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/socket-client.js"></script>
  <script src="/js/lobby.js"></script>
</body>
</html>
