services:
  - type: web
    name: kdk-induction-quiz-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: kdk-quiz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@kdkce.edu
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_JOIN_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: SOCKET_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: kdk-quiz-db
    databaseName: kdk_induction_quiz
    user: kdk_admin
    plan: starter
